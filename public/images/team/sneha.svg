<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c18"/>
      <stop offset="50%" stop-color="#1e1035"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#00d2ff"/>
    </linearGradient>
    <linearGradient id="blazer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e1065"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(192,132,252,0.08)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="600" height="450" fill="url(#bg)"/>
  <rect width="600" height="450" fill="url(#grid)"/>

  <!-- Radiant Aura behind head -->
  <circle cx="300" cy="190" r="140" fill="none" stroke="url(#glow)" stroke-width="2" opacity="0.35"/>
  <circle cx="300" cy="190" r="110" fill="none" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.4"/>

  <!-- Shoulders & Outfit -->
  <path d="M 130 450 C 130 310, 210 300, 275 320 L 300 370 L 325 320 C 390 300, 470 310, 470 450 Z" fill="url(#blazer)" stroke="rgba(192,132,252,0.3)" stroke-width="2"/>
  <path d="M 275 320 L 300 365 L 325 320 L 300 280 Z" fill="#ffffff" opacity="0.9"/>
  <path d="M 295 325 L 300 365 L 305 325 Z" fill="#c084fc"/>

  <!-- Head -->
  <ellipse cx="300" cy="190" rx="70" ry="82" fill="#1e293b" stroke="url(#glow)" stroke-width="3"/>

  <!-- Modern Hair Silhouette -->
  <path d="M 215 160 C 215 90, 385 90, 385 160 C 385 240, 355 270, 345 270 C 340 240, 360 190, 360 160 C 340 125, 260 125, 240 160 C 240 190, 260 240, 255 270 C 245 270, 215 240, 215 160 Z" fill="#0f172a" stroke="#c084fc" stroke-width="1.5"/>

  <!-- Corner Crosshairs -->
  <path d="M 30 50 L 30 30 L 50 30" fill="none" stroke="#c084fc" stroke-width="2" opacity="0.6"/>
  <path d="M 570 50 L 570 30 L 550 30" fill="none" stroke="#c084fc" stroke-width="2" opacity="0.6"/>
  <path d="M 30 400 L 30 420 L 50 420" fill="none" stroke="#c084fc" stroke-width="2" opacity="0.6"/>
  <path d="M 570 400 L 570 420 L 550 420" fill="none" stroke="#c084fc" stroke-width="2" opacity="0.6"/>

  <!-- Monogram Badge -->
  <rect x="230" y="390" width="140" height="40" rx="20" fill="#0a0f1d" stroke="#c084fc" stroke-width="2" opacity="0.95"/>
  <text x="300" y="416" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="15" text-anchor="middle" letter-spacing="3">SNEHA (SB)</text>
</svg>